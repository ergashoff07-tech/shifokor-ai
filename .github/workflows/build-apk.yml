name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf src_build
          mkdir src_build
          unzip -q shifokor-ai-src.zip -d src_build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: src_build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Sign with release key (so it installs over the previous version)
        env:
          SIGN_KEY_B64: ${{ secrets.SIGN_KEY_B64 }}
          SIGN_CERT_B64: ${{ secrets.SIGN_CERT_B64 }}
        run: |
          cp src_build/app/build/outputs/apk/debug/app-debug.apk ShifokorAI-debug.apk
          if [ -n "$SIGN_KEY_B64" ] && [ -n "$SIGN_CERT_B64" ]; then
            pip install cryptography
            echo "$SIGN_KEY_B64" | base64 -d > key.pem
            echo "$SIGN_CERT_B64" | base64 -d > cert.der
            python3 src_build/sign_apk.py ShifokorAI-debug.apk ShifokorAI.apk key.pem cert.der
            rm -f key.pem cert.der ShifokorAI-debug.apk
          else
            echo "::warning::SIGN_KEY_B64 / SIGN_CERT_B64 secrets yo'q: APK debug kaliti bilan imzolandi, eski versiya ustiga o'rnatilmaydi"
            mv ShifokorAI-debug.apk ShifokorAI.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ShifokorAI-apk
          path: ShifokorAI.apk
