name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf src_build
          mkdir src_build
          unzip -q shifokor-ai-src.zip -d src_build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: src_build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp src_build/app/build/outputs/apk/debug/app-debug.apk ShifokorAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShifokorAI-apk
          path: ShifokorAI.apk
